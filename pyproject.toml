[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "toss-auto-trading"
version = "0.1.0"
description = "Risk-controlled momentum trading bot for Toss Securities OpenAPI"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
toss-trader = "toss_trader.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

